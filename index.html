<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quest for the Claw</title>
<style>
body { margin: 0; padding: 0; background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Courier New', monospace; }
#gameContainer { position: relative; }
canvas { border: 4px solid #4a3728; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
#instructions { position: absolute; bottom: -60px; left: 0; right: 0; color: #8b7355; font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div id="gameContainer">
<canvas id="gameCanvas" width="800" height="450"></canvas>
<div id="instructions">ARROWS/A+D: Move | SPACE: Jump | UP/W: Grab Vine | DOWN/S: Drop | R: Restart | P: Pause | D: Debug</div>
</div>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
const W=800,H=450,G=400,GRAV=0.6,JUMP=-12,ACCEL=0.8,FRICT=0.8;
let gameState='TITLE',debug=false,curScr=0,lives=3,score=0,cpScr=0,invuln=0,shake=0,frame=0;
const keys={};
let manualInput={},botInput={},botEnabled=false;
let rngSeed=12345;
let botMemory={screen:0,jumpIndex:0};
const pl={x:100,y:300,w:20,h:32,vx:0,vy:0,gnd:false,vine:null,va:0,vv:0,face:1};
let boulders=[],darts=[],parts=[],logs=[];

function rand(){
if(!botEnabled)return Math.random();
rngSeed=(rngSeed*1664525+1013904223)%4294967296;
return rngSeed/4294967296;
}

function inputDown(code){
return (botEnabled?!!botInput[code]:false)||!!manualInput[code]||!!keys[code];
}

function resetBotMemory(){
botMemory={screen:curScr,jumpIndex:0};
}

function runBot(){
const s=SCRS[curScr];
const hints=(s.meta&&s.meta.hints)||{};
if(botMemory.screen!==curScr)resetBotMemory();
botInput={};
const right=true;
if(pl.vine!==null){
botInput.ArrowRight=right;
if(hints.vine&&pl.x>hints.vine.releaseX)botInput.Space=true;
return;
}
if(hints.vine){
if(pl.x<hints.vine.grabX){
botInput.ArrowRight=right;
}
if(pl.x>=hints.vine.grabX-8&&pl.x<=hints.vine.grabX+12){
botInput.ArrowUp=true;
}
if(pl.x>=hints.vine.grabX){
botInput.ArrowRight=right;
}
}
if(!hints.vine||pl.x<hints.vine.releaseX){
botInput.ArrowRight=right;
}
if(hints.jumpAt&&pl.gnd&&botMemory.jumpIndex<hints.jumpAt.length){
if(pl.x>hints.jumpAt[botMemory.jumpIndex]){
botInput.Space=true;
botMemory.jumpIndex++;
}
}
if(hints.avoidSpikes&&pl.gnd){
const spikes=s.s||[];
for(const sp of spikes){
if(pl.x+pl.w>sp.x-10&&pl.x+pl.w<sp.x+sp.w+10){
botInput.Space=true;
break;
}
}
}
}
const SCRS=[
{p:[{x:0,y:G,w:800,h:50},{x:200,y:320,w:80,h:20},{x:500,y:280,w:100,h:20}],s:[],v:[],c:[{x:220,y:290,f:0},{x:540,y:250,f:0}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450},hints:{jumpAt:[]}}},
{p:[{x:0,y:G,w:150,h:50},{x:580,y:G,w:220,h:50},{x:210,y:250,w:200,h:20},{x:460,y:300,w:140,h:20}],s:[{x:150,y:G-20,w:430,h:20}],v:[{x:400,y:50,l:180,a:0}],c:[{x:330,y:220,f:0}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450},hints:{jumpAt:[125,350,480],vine:{index:0,grabX:320,releaseX:560}}}},
{p:[{x:0,y:G,w:800,h:50},{x:150,y:300,w:100,h:20},{x:550,y:280,w:120,h:20}],s:[],v:[],b:1,c:[{x:190,y:270,f:0},{x:600,y:250,f:0}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450},hints:{jumpAt:[]}}},
{p:[{x:0,y:G,w:200,h:50},{x:250,y:320,w:60,h:20},{x:380,y:260,w:60,h:20},{x:520,y:200,w:60,h:20},{x:650,y:G,w:150,h:50}],s:[],v:[{x:150,y:50,l:150,a:0},{x:350,y:40,l:140,a:0.3},{x:500,y:50,l:160,a:-0.2}],c:[{x:270,y:290,f:0},{x:540,y:170,f:0}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450},hints:{jumpAt:[180,310,440,570]}}},
{p:[{x:0,y:G,w:100,h:50},{x:200,y:G-40,w:400,h:90},{x:700,y:G,w:100,h:50}],s:[{x:250,y:G-60,w:30,h:20},{x:350,y:G-60,w:30,h:20},{x:450,y:G-60,w:30,h:20},{x:550,y:G-60,w:30,h:20}],v:[],c:[{x:400,y:300,f:0}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450},hints:{jumpAt:[180],avoidSpikes:true}}},
{p:[{x:0,y:G,w:800,h:50},{x:350,y:300,w:100,h:20},{x:150,y:250,w:80,h:20},{x:570,y:250,w:80,h:20}],s:[],v:[],cp:1,cpx:380,c:[{x:180,y:220,f:0},{x:600,y:220,f:0}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450},hints:{jumpAt:[]}}},
{p:[{x:0,y:G,w:150,h:50},{x:200,y:320,w:80,h:20},{x:350,y:280,w:80,h:20},{x:500,y:320,w:80,h:20},{x:650,y:G,w:150,h:50}],s:[],v:[],d:1,c:[{x:230,y:290,f:0},{x:380,y:250,f:0},{x:530,y:290,f:0}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450},hints:{jumpAt:[140,260,410,560]}}},
{p:[{x:0,y:G,w:120,h:50},{x:250,y:300,w:100,h:20},{x:450,y:260,w:80,h:20},{x:680,y:G,w:120,h:50}],s:[],v:[{x:350,y:50,l:160,a:0},{x:550,y:50,l:170,a:0.2}],croc:[{x:120,y:G-10,w:560,h:60}],c:[{x:290,y:270,f:0},{x:480,y:230,f:0}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450},hints:{jumpAt:[100,340],vine:{index:1,grabX:520,releaseX:650}}}},
{p:[{x:0,y:G,w:800,h:50},{x:100,y:150,w:60,h:250},{x:640,y:150,w:60,h:250},{x:350,y:200,w:100,h:20}],s:[],v:[],l:1,c:[{x:380,y:170,f:0}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450},hints:{jumpAt:[80,620]}}},
{p:[{x:0,y:G,w:100,h:50},{x:100,y:360,w:100,h:90},{x:200,y:320,w:100,h:130},{x:300,y:280,w:100,h:170},{x:400,y:240,w:300,h:210},{x:700,y:160,w:100,h:290}],s:[{x:420,y:220,w:260,h:20}],v:[{x:500,y:30,l:140,a:0}],c:[{x:150,y:330,f:0},{x:350,y:250,f:0},{x:750,y:130,f:0}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450},hints:{jumpAt:[80,180,280,380,480,600]}}},
{p:[{x:0,y:160,w:150,h:290},{x:250,y:200,w:50,h:20},{x:400,y:180,w:50,h:20},{x:550,y:220,w:50,h:20},{x:700,y:G-100,w:100,h:150}],s:[],v:[{x:100,y:40,l:130,a:0},{x:280,y:30,l:140,a:0.3},{x:450,y:35,l:135,a:-0.2},{x:600,y:40,l:150,a:0.1}],c:[{x:420,y:150,f:0}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450},hints:{jumpAt:[200,360,510,660]}}},
{p:[{x:0,y:G,w:300,h:50},{x:500,y:G,w:300,h:50},{x:380,y:280,w:40,h:120}],s:[{x:300,y:G-20,w:200,h:20}],v:[],win:1,c:[{x:100,y:350,f:0},{x:700,y:350,f:0}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450},hints:{jumpAt:[260,380],avoidSpikes:true}}}
];

const botQuery=new URLSearchParams(location.search).get('bot')==='1';
if(window.__QFTC_BOT__||botQuery)botEnabled=true;

if(botEnabled){gameState='PLAYING';reset();}

document.addEventListener('keydown',e=>{
keys[e.code]=true;
if(e.code==='KeyR')reset();
if(e.code==='KeyP')gameState=gameState==='PLAYING'?'PAUSED':(gameState==='PAUSED'?'PLAYING':gameState);
if(e.code==='KeyD')debug=!debug;
if(gameState==='TITLE'&&e.code==='Space'){gameState='PLAYING';reset();}
if(gameState==='GAMEOVER'&&e.code==='Space'){gameState='PLAYING';reset();}
if(gameState==='VICTORY'&&e.code==='Space'){gameState='TITLE';}
});
document.addEventListener('keyup',e=>keys[e.code]=false);

function reset(){
lives=3;score=0;curScr=0;cpScr=0;
SCRS.forEach(s=>{if(s.c)s.c.forEach(c=>c.f=0);});
pl.x=50;pl.y=250;pl.vx=0;pl.vy=0;pl.vine=null;invuln=60;
boulders=[];darts=[];parts=[];logs=[];
resetBotMemory();
}

function hurt(){
if(invuln>0)return;
lives--;invuln=120;shake=10;
if(lives<=0)gameState='GAMEOVER';
else{curScr=cpScr;pl.x=50;pl.y=250;pl.vx=0;pl.vy=0;pl.vine=null;invuln=60;boulders=[];darts=[];logs=[];}
}

function update(){
if(botEnabled&&(gameState==='TITLE'||gameState==='GAMEOVER')){gameState='PLAYING';reset();}
if(gameState!=='PLAYING')return;
frame++;
if(invuln>0)invuln--;
if(shake>0)shake--;
const s=SCRS[curScr];
if(botEnabled)runBot();
const left=inputDown('ArrowLeft')||inputDown('KeyA');
const right=inputDown('ArrowRight')||inputDown('KeyD');
const up=inputDown('ArrowUp')||inputDown('KeyW');
const down=inputDown('ArrowDown')||inputDown('KeyS');
const jump=inputDown('Space');
if(s.b&&frame%150===0)boulders.push({x:850,y:200,r:20,vx:-4,vy:0});
if(s.l&&frame%180===0)logs.push({x:200+rand()*400,y:-30,r:15,vy:3});
if(s.d&&frame%120===0)darts.push({x:0,y:250,vx:5});
boulders.forEach(b=>{b.x+=b.vx;b.vy+=GRAV;b.y+=b.vy;if(b.y+b.r>G){b.y=G-b.r;b.vy*=-0.6;}if(Math.hypot(pl.x+pl.w/2-b.x,pl.y+pl.h/2-b.y)<b.r+pl.w/2)hurt();});
boulders=boulders.filter(b=>b.x>-50);
logs.forEach(l=>{l.y+=l.vy;if(Math.hypot(pl.x+pl.w/2-l.x,pl.y+pl.h/2-l.y)<l.r+pl.w/2)hurt();});
logs=logs.filter(l=>l.y<H+50);
darts.forEach(d=>{d.x+=d.vx;if(pl.x+pl.w>d.x-5&&pl.x<d.x+5&&pl.y+pl.h>d.y-3&&pl.y<d.y+3)hurt();});
darts=darts.filter(d=>d.x<W);
if(pl.vine!==null){
const v=s.v[pl.vine];
const swing=left?-0.03:right?0.03:0;
pl.vv+=swing+Math.sin(pl.va)*0.01;
pl.vv*=0.99;pl.va+=pl.vv;
pl.va=Math.max(-1.2,Math.min(1.2,pl.va));
pl.x=v.x+Math.sin(pl.va)*v.l-pl.w/2;
pl.y=v.y+Math.cos(pl.va)*v.l;
pl.vx=0;pl.vy=0;
if(jump){pl.vine=null;pl.vy=JUMP;pl.vx=Math.sin(pl.va)*10;}
if(down)pl.vine=null;
return;
}
if(left){pl.vx-=ACCEL;pl.face=-1;}
if(right){pl.vx+=ACCEL;pl.face=1;}
pl.vx*=FRICT;pl.vy+=GRAV;
if(jump&&pl.gnd){pl.vy=JUMP;pl.gnd=false;}
pl.x+=pl.vx;pl.y+=pl.vy;
if(pl.x<0){if(curScr>0){curScr--;pl.x=W-pl.w-5;}else{pl.x=0;pl.vx=0;}}
if(pl.x>W-pl.w){if(curScr<SCRS.length-1){curScr++;score+=10;if(s.cp&&curScr-1>cpScr)cpScr=curScr-1;pl.x=5;}else{pl.x=W-pl.w;pl.vx=0;}}
pl.gnd=false;
for(let i=0;i<s.p.length;i++){
const p=s.p[i];
if(pl.x+pl.w>p.x&&pl.x<p.x+p.w&&pl.y+pl.h>p.y&&pl.y+pl.h<p.y+p.h+20&&pl.vy>=0){pl.y=p.y-pl.h;pl.vy=0;pl.gnd=true;}
}
if(up){
for(let i=0;i<s.v.length;i++){
const v=s.v[i];
if(Math.hypot(pl.x+pl.w/2-(v.x+Math.sin(v.a)*v.l),pl.y-(v.y+Math.cos(v.a)*v.l))<40){pl.vine=i;pl.va=v.a;pl.vv=0;break;}
}
}
if(pl.y>H)hurt();
for(let i=0;i<(s.s||[]).length;i++){const sp=s.s[i];if(pl.x+pl.w>sp.x&&pl.x<sp.x+sp.w&&pl.y+pl.h>sp.y&&pl.y<sp.y+sp.h)hurt();}
for(let i=0;i<(s.croc||[]).length;i++){const cr=s.croc[i];if(pl.x+pl.w>cr.x&&pl.x<cr.x+cr.w&&pl.y+pl.h>cr.y+20)hurt();}
for(let i=0;i<(s.c||[]).length;i++){
const c=s.c[i];
if(!c.f&&pl.x+pl.w>c.x-10&&pl.x<c.x+10&&pl.y+pl.h>c.y-10&&pl.y<c.y+10){c.f=1;score+=50;for(let j=0;j<8;j++)parts.push({x:c.x,y:c.y,vx:(rand()-0.5)*6,vy:(rand()-0.5)*6,life:30,col:'#FFD700'});}
}
if(s.win&&pl.x>360&&pl.x<440&&pl.y+pl.h>250){score+=500;gameState='VICTORY';}
for(let i=parts.length-1;i>=0;i--){const pt=parts[i];pt.x+=pt.vx;pt.y+=pt.vy;pt.life--;if(pt.life<=0)parts.splice(i,1);}
}

function draw(){
ctx.save();
if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
ctx.fillStyle='#0d1f0d';ctx.fillRect(0,0,W,H);
const s=SCRS[curScr];
const off=curScr*100;
for(let i=0;i<20;i++){
ctx.fillStyle='#1a3d1a';
ctx.beginPath();
ctx.moveTo(i*50-off%100,450);
ctx.lineTo(i*50+25-off%100,150+Math.sin(i)*50);
ctx.lineTo(i*50+50-off%100,450);
ctx.fill();
}
ctx.fillStyle='#2d4a3e';
for(let i=0;i<5;i++){
const rx=150+i*200-off*0.5%1000;
ctx.fillRect(rx,250,80,150);
ctx.beginPath();ctx.moveTo(rx,250);ctx.lineTo(rx+40,200);ctx.lineTo(rx+80,250);ctx.fill();
}
ctx.fillStyle='#5a5a5a';
for(const p of s.p){
ctx.fillRect(p.x,p.y,p.w,p.h);
ctx.fillStyle='#3d7a3d';ctx.fillRect(p.x,p.y,p.w,5);ctx.fillStyle='#5a5a5a';
ctx.strokeStyle='#3a3a3a';ctx.strokeRect(p.x,p.y,p.w,p.h);
}
ctx.fillStyle='#888';
for(const sp of s.s||[]){
for(let i=0;i<sp.w;i+=10){
ctx.beginPath();
ctx.moveTo(sp.x+i,sp.y+sp.h);
ctx.lineTo(sp.x+i+5,sp.y);
ctx.lineTo(sp.x+i+10,sp.y+sp.h);
ctx.fill();
}
}
for(const cr of s.croc||[]){
ctx.fillStyle='#1a4d6b';
ctx.fillRect(cr.x,cr.y+20,cr.w,cr.h-20);
for(let i=0;i<cr.w;i+=40){
ctx.fillStyle='#2a6d9b';
ctx.beginPath();
ctx.moveTo(cr.x+i+10,cr.y+30);
ctx.lineTo(cr.x+i+20,cr.y+15);
ctx.lineTo(cr.x+i+30,cr.y+30);
ctx.fill();
}
}
ctx.strokeStyle='#4a7c23';ctx.lineWidth=3;
for(const v of s.v||[]){
const vx=v.x+Math.sin(v.a)*v.l;
const vy=v.y+Math.cos(v.a)*v.l;
ctx.beginPath
();ctx.moveTo(v.x,v.y);ctx.lineTo(vx,vy);ctx.stroke();
ctx.fillStyle='#6b8e23';
ctx.beginPath();ctx.arc(vx,vy,8,0,Math.PI*2);ctx.fill();
}
for(const b of boulders){
ctx.fillStyle='#8b4513';
ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#5a2d0c';ctx.stroke();
}
for(const l of logs){
ctx.save();
ctx.translate(l.x,l.y);
ctx.fillStyle='#8b5a2b';
ctx.fillRect(-l.r,-l.r*2,l.r*2,l.r*4);
ctx.restore();
}
for(const d of darts){
ctx.fillStyle='#f00';
ctx.fillRect(d.x,d.y-2,12,4);
ctx.fillStyle='#ff0';
ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-5,d.y-3);ctx.lineTo(d.x-5,d.y+3);ctx.fill();
}
for(const c of s.c||[]){
if(!c.f){
ctx.fillStyle='#FFD700';
ctx.beginPath();ctx.arc(c.x,c.y,6,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#FFA500';
ctx.beginPath();ctx.arc(c.x,c.y,4,0,Math.PI*2);ctx.fill();
}
}
if(s.cp){
ctx.fillStyle='#8B4513';
ctx.fillRect(s.cpx-15,G-80,30,80);
ctx.fillStyle='#D2691E';
ctx.fillRect(s.cpx-20,G-90,40,15);
ctx.fillStyle='#FFD700';
for(let i=0;i<3;i++){
ctx.beginPath();ctx.arc(s.cpx-10+i*10,G-75,4,0,Math.PI*2);ctx.fill();
}
}
if(s.win){
ctx.fillStyle='#4a4a4a';
ctx.fillRect(360,180,80,100);
ctx.fillStyle='#2a2a2a';
ctx.fillRect(370,190,60,5);
const glow=Math.sin(frame*0.1)*10+20;
ctx.shadowColor='#FFD700';ctx.shadowBlur=glow;
ctx.fillStyle='#FFD700';
ctx.beginPath();ctx.moveTo(400,210);ctx.lineTo(410,240);ctx.lineTo(390,240);ctx.fill();
ctx.beginPath();ctx.moveTo(400,240);ctx.lineTo(415,260);ctx.lineTo(385,260);ctx.fill();
ctx.shadowBlur=0;
}
for(const pt of parts){
ctx.globalAlpha=pt.life/30;
ctx.fillStyle=pt.col;
ctx.fillRect(pt.x-2,pt.y-2,4,4);
ctx.globalAlpha=1;
}
if(invuln>0&&Math.floor(frame/4)%2===0){
}else{
ctx.fillStyle='#F4C2A1';
ctx.fillRect(pl.x,pl.y,pl.w,pl.h);
ctx.fillStyle='#5C4033';
ctx.fillRect(pl.x,pl.y,pl.w,8);
ctx.fillStyle='#333';
ctx.fillRect(pl.x+(pl.face>0?14:4),pl.y+2,4,4);
ctx.fillStyle='#8B4513';
ctx.fillRect(pl.x,pl.y+12,pl.w,8);
ctx.fillStyle='#333';
ctx.fillRect(pl.x+4,pl.y+20,5,12);
ctx.fillRect(pl.x+11,pl.y+20,5,12);
ctx.fillStyle='#5C4033';
ctx.beginPath();ctx.arc(pl.x+pl.w/2,pl.y-8,12,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#3d3d3d';
ctx.fillRect(pl.x-2+(pl.face>0?18:0),pl.y-12,6,4);
}
ctx.fillStyle='#fff';
ctx.font='16px monospace';
ctx.fillText('LIVES:'+lives,10,20);
ctx.fillText('SCORE:'+score,100,20);
ctx.fillText('SCREEN:'+(curScr+1)+'/12',200,20);
if(debug){
ctx.fillStyle='#0f0';
ctx.fillText('FPS:'+Math.round(60),10,40);
ctx.fillText('POS:'+Math.round(pl.x)+','+Math.round(pl.y),10,60);
ctx.fillText('VINE:'+(pl.vine!==null?'YES':'NO'),10,80);
ctx.strokeStyle='#0f0';ctx.strokeRect(pl.x,pl.y,pl.w,pl.h);
}
if(gameState==='TITLE'){
ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#FFD700';ctx.font='bold 48px monospace';
ctx.fillText('QUEST FOR THE CLAW',140,150);
ctx.fillStyle='#fff';ctx.font='20px monospace';
ctx.fillText('Navigate the jungle ruins and collect',200,200);
ctx.fillText('the legendary golden claw!',250,230);
ctx.fillStyle='#0f0';ctx.font='24px monospace';
ctx.fillText('Press SPACE to Start',280,320);
}
if(gameState==='PAUSED'){
ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#FFD700';ctx.font='bold 48px monospace';
ctx.fillText('PAUSED',330,240);
}
if(gameState==='GAMEOVER'){
ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#f00';ctx.font='bold 48px monospace';
ctx.fillText('GAME OVER',280,200);
ctx.fillStyle='#fff';ctx.font='24px monospace';
ctx.fillText('Final Score: '+score,320,260);
ctx.fillText('Press SPACE to Retry',270,320);
}
if(gameState==='VICTORY'){
ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,W,H);
const glow=Math.sin(frame*0.1)*20+30;
ctx.shadowColor='#FFD700';ctx.shadowBlur=glow;
ctx.fillStyle='#FFD700';ctx.font='bold 48px monospace';
ctx.fillText('VICTORY!',300,180);
ctx.shadowBlur=0;
ctx.fillStyle='#fff';ctx.font='24px monospace';
ctx.fillText('You found the Golden Claw!',240,240);
ctx.fillText('Final Score: '+score,320,280);
ctx.fillText('Press SPACE to Return',260,340);
}
ctx.restore();
}

function loop(){
update();
draw();
requestAnimationFrame(loop);
}

window.__qftc={
getState:()=>({
score,lives,frame,gameState,
screenIndex:curScr,
victory:gameState==='VICTORY',
gameOver:gameState==='GAMEOVER',
player:{x:pl.x,y:pl.y,vx:pl.vx,vy:pl.vy,gnd:pl.gnd,vine:pl.vine}
}),
setInput:(state)=>{manualInput={...manualInput,...state};},
step:(dt=16.67)=>{
const steps=Math.max(1,Math.round(dt/16.67));
for(let i=0;i<steps;i++)update();
draw();
},
enableBot:(on=true)=>{botEnabled=on;if(on){gameState='PLAYING';reset();}},
setSeed:(seed)=>{rngSeed=seed>>>0;},
getScreenMeta:()=>SCRS.map(s=>s.meta)
};
window.__qftc.tick=window.__qftc.step;

reset();
loop();
</script>
</body>
</html>
