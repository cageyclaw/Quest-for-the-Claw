<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quest for the Claw</title>
<style>
body { margin: 0; padding: 0; background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Courier New', monospace; }
#gameContainer { position: relative; }
canvas { border: 4px solid #4a3728; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
#instructions { position: absolute; bottom: -60px; left: 0; right: 0; color: #8b7355; font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div id="gameContainer">
<canvas id="gameCanvas" width="800" height="450"></canvas>
<div id="instructions">ARROWS: Move (A/D optional) | SPACE: Jump/Release Vine | R: Restart | P: Pause | D: Debug</div>
</div>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
// Ensure the canvas can receive keyboard focus so SPACE/ARROWS work reliably.
canvas.tabIndex = 0;
canvas.focus();
const startGame = () => { if (gameState === 'TITLE') { gameState = 'PLAYING'; reset(); } };

canvas.addEventListener('pointerdown', () => {
  canvas.focus();
  startGame();
});

// Also allow clicking anywhere on the page to focus + start.
window.addEventListener('pointerdown', () => {
  canvas.focus();
  startGame();
});
const W=800,H=450,G=400,GRAV=0.6,JUMP=-12,ACCEL=0.8,FRICT=0.8;
let gameState='TITLE',debug=false,curScr=0,lives=3,score=0,cpScr=0,invuln=0,shake=0,frame=0;
const keys={};
let manualInput={},botInput={},botEnabled=false;
let rngSeed=12345;
let botMemory={screen:0,jumpIndex:0};
const pl={x:100,y:300,w:20,h:32,vx:0,vy:0,gnd:false,vine:null,va:0,vv:0,face:1};
let rollers=[],parts=[];

function rand(){
if(!botEnabled)return Math.random();
rngSeed=(rngSeed*1664525+1013904223)%4294967296;
return rngSeed/4294967296;
}

function inputDown(code){
return (botEnabled?!!botInput[code]:false)||!!manualInput[code]||!!keys[code];
}

function resetBotMemory(){
botMemory={screen:curScr,jumpIndex:0};
}

function runBot(){
const s=SCRS[curScr];
const hints=(s.meta&&s.meta.hints)||{};
if(botMemory.screen!==curScr)resetBotMemory();
botInput={};
const right=true;
if(pl.vine!==null){
botInput.ArrowRight=right;
if(hints.vine&&pl.x>hints.vine.releaseX)botInput.Space=true;
return;
}
if(hints.vine){
if(pl.x<hints.vine.grabX){
botInput.ArrowRight=right;
}
if(pl.x>=hints.vine.grabX-8&&pl.x<=hints.vine.grabX+12&&pl.gnd){
botInput.Space=true;
}
if(pl.x>=hints.vine.grabX){
botInput.ArrowRight=right;
}
}
if(!hints.vine||pl.x<hints.vine.releaseX){
botInput.ArrowRight=right;
}
if(hints.jumpAt&&pl.gnd&&botMemory.jumpIndex<hints.jumpAt.length){
if(pl.x>hints.jumpAt[botMemory.jumpIndex]){
botInput.Space=true;
botMemory.jumpIndex++;
}
}
if(hints.avoidSpikes&&pl.gnd){
const spikes=s.s||[];
for(const sp of spikes){
if(pl.x+pl.w>sp.x-10&&pl.x+pl.w<sp.x+sp.w+10){
botInput.Space=true;
break;
}
}
}
}
const SCRS=[
{p:[{x:0,y:G,w:800,h:50}],roll:1,c:[{x:220,y:G-70,f:0},{x:520,y:G-70,f:0}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450}}},
{p:[{x:0,y:G,w:180,h:50},{x:520,y:G,w:280,h:50}],water:[{x:180,y:G-20,w:340,h:70}],v:[{x:360,y:60,l:190,a:0}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450}}},
{p:[{x:0,y:G,w:800,h:50}],roll:1,c:[{x:120,y:G-70,f:0},{x:650,y:G-70,f:0}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450}}},
{p:[{x:0,y:G,w:200,h:50},{x:540,y:G,w:260,h:50}],water:[{x:200,y:G-20,w:340,h:70}],v:[{x:380,y:60,l:190,a:0.2}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450}}},
{p:[{x:0,y:G,w:800,h:50}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450}}},
{p:[{x:0,y:G,w:160,h:50},{x:520,y:G,w:280,h:50}],water:[{x:160,y:G-20,w:360,h:70}],v:[{x:340,y:55,l:200,a:-0.1}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450}}},
{p:[{x:0,y:G,w:800,h:50}],roll:1,c:[{x:300,y:G-70,f:0},{x:580,y:G-70,f:0}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450}}},
{p:[{x:0,y:G,w:120,h:50},{x:560,y:G,w:240,h:50}],water:[{x:120,y:G-20,w:440,h:70}],v:[{x:360,y:50,l:200,a:0.4}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450}}},
{p:[{x:0,y:G,w:180,h:50},{x:620,y:G,w:180,h:50}],crocWater:{x:180,y:G-20,w:440,h:70},crocs:[{x:220,y:G-35,w:60,h:20,phase:0},{x:320,y:G-35,w:60,h:20,phase:60},{x:420,y:G-35,w:60,h:20,phase:120},{x:520,y:G-35,w:60,h:20,phase:180}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450}}},
{p:[{x:0,y:G,w:800,h:50}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450}}},
{p:[{x:0,y:G,w:220,h:50},{x:560,y:G,w:240,h:50}],water:[{x:220,y:G-20,w:340,h:70}],v:[{x:380,y:60,l:190,a:-0.3}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450}}},
{p:[{x:0,y:G,w:800,h:50}],roll:1,c:[{x:160,y:G-70,f:0},{x:680,y:G-70,f:0}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450}}},
{p:[{x:0,y:G,w:300,h:50},{x:500,y:G,w:300,h:50}],win:1,c:[{x:120,y:G-70,f:0},{x:680,y:G-70,f:0}],meta:{spawn:{x:50,y:250},exit:{x:760,y:0,w:40,h:450}}}
];

const botQuery=new URLSearchParams(location.search).get('bot')==='1';
if(window.__QFTC_BOT__||botQuery)botEnabled=true;

if(botEnabled){gameState='PLAYING';reset();}

const onKeyDown = (e)=>{
  canvas.focus();
  keys[e.code]=true;
  if(e.code==='KeyR')reset();
  if(e.code==='KeyP')gameState=gameState==='PLAYING'?'PAUSED':(gameState==='PAUSED'?'PLAYING':gameState);
  if(e.code==='KeyD')debug=!debug;

  const isStart = (e.code==='Space'||e.code==='Enter'||e.key===' '||e.key==='Enter'||e.keyCode===32||e.keyCode===13);
  if(isStart){ e.preventDefault(); }

  if(gameState==='TITLE'&&isStart){ startGame(); }
  if(gameState==='GAMEOVER'&&isStart){gameState='PLAYING';reset();}
  if(gameState==='VICTORY'&&isStart){gameState='TITLE';}
};
window.addEventListener('keydown',onKeyDown,true);
document.addEventListener('keydown',onKeyDown);
document.addEventListener('keyup',e=>keys[e.code]=false);

function reset(){
lives=3;score=0;curScr=0;cpScr=0;
SCRS.forEach(s=>{
if(s.c)s.c.forEach(c=>c.f=0);
if(s.v)s.v.forEach(v=>{
if(v.base==null)v.base=v.a||0;
if(v.amp==null)v.amp=0.7;
if(v.freq==null)v.freq=0.018+rand()*0.008;
if(v.phase==null)v.phase=rand()*Math.PI*2;
if(v.lBase==null)v.lBase=v.l;
v.l=v.lBase+40;
if(v.angle==null)v.angle=v.base;
if(v.angVel==null)v.angVel=0;
});
if(s.crocs)s.crocs.forEach(c=>{if(c.period==null)c.period=180;});
});
pl.x=50;pl.y=250;pl.vx=0;pl.vy=0;pl.vine=null;invuln=60;
rollers=[];parts=[];
resetBotMemory();
}

function hurt(){
if(invuln>0)return;
lives--;invuln=120;shake=10;
if(lives<=0)gameState='GAMEOVER';
else{curScr=cpScr;pl.x=50;pl.y=250;pl.vx=0;pl.vy=0;pl.vine=null;invuln=60;rollers=[];}
}

function update(){
if(botEnabled&&(gameState==='TITLE'||gameState==='GAMEOVER')){gameState='PLAYING';reset();}
if(gameState!=='PLAYING')return;
const prevScr=curScr;
frame++;
if(invuln>0)invuln--;
if(shake>0)shake--;
const s=SCRS[curScr];
for(const v of s.v||[]){
const theta=v.base+Math.sin(frame*v.freq+v.phase)*v.amp;
v.angle=theta;
v.angVel=v.amp*v.freq*Math.cos(frame*v.freq+v.phase);
v.a=theta;
}
if(botEnabled)runBot();
const left=inputDown('ArrowLeft')||inputDown('KeyA');
const right=inputDown('ArrowRight')||inputDown('KeyD');
const up=inputDown('ArrowUp')||inputDown('KeyW');
const down=inputDown('ArrowDown')||inputDown('KeyS');
const jump=inputDown('Space');
if(s.roll&&frame%140===0)rollers.push({x:W+30,y:G-15,r:15,vx:-3.5});
rollers.forEach(r=>{r.x+=r.vx;if(Math.hypot(pl.x+pl.w/2-r.x,pl.y+pl.h/2-r.y)<r.r+pl.w/2)hurt();});
rollers=rollers.filter(r=>r.x>-60);
if(pl.vine!==null){
const v=s.v[pl.vine];
const ang=v.angle;
pl.x=v.x+Math.sin(ang)*v.l-pl.w/2;
pl.y=v.y+Math.cos(ang)*v.l;
pl.vx=0;pl.vy=0;pl.gnd=false;
if(jump){
const tvx=Math.cos(ang)*v.l*v.angVel;
const tvy=-Math.sin(ang)*v.l*v.angVel;
pl.vine=null;
pl.vx=tvx;
pl.vy=tvy+JUMP;
}
return;
}
if(left){pl.vx-=ACCEL;pl.face=-1;}
if(right){pl.vx+=ACCEL;pl.face=1;}
pl.vx*=FRICT;pl.vy+=GRAV;
if(jump&&pl.gnd){pl.vy=JUMP;pl.gnd=false;}
pl.x+=pl.vx;pl.y+=pl.vy;
if(pl.x<0){if(curScr>0){curScr--;pl.x=W-pl.w-5;}else{pl.x=0;pl.vx=0;}}
if(pl.x>W-pl.w){if(curScr<SCRS.length-1){curScr++;score+=10;if(s.cp&&curScr-1>cpScr)cpScr=curScr-1;pl.x=5;}else{pl.x=W-pl.w;pl.vx=0;}}
if(curScr!==prevScr){
const ns=SCRS[curScr];
if(!ns.roll||ns.water||ns.crocWater)rollers=[];
}
pl.gnd=false;
for(let i=0;i<s.p.length;i++){
const p=s.p[i];
if(pl.x+pl.w>p.x&&pl.x<p.x+p.w&&pl.y+pl.h>p.y&&pl.y+pl.h<p.y+p.h+20&&pl.vy>=0){pl.y=p.y-pl.h;pl.vy=0;pl.gnd=true;}
}
if(pl.vine===null&&!pl.gnd){
for(let i=0;i<s.v.length;i++){
const v=s.v[i];
const vx=v.x+Math.sin(v.angle)*v.l;
const vy=v.y+Math.cos(v.angle)*v.l;
if(Math.hypot(pl.x+pl.w/2-vx,pl.y+pl.h/2-vy)<30){
pl.vine=i;
pl.x=vx-pl.w/2;
pl.y=vy;
pl.vx=0;pl.vy=0;
pl.gnd=false;
break;
}
}
}
if(pl.y>H)hurt();
// water hazards
let onCroc=false;
if(s.crocs&&s.crocWater){
for(const cr of s.crocs){
const phase=(frame+cr.phase)%cr.period;
const closed=phase<cr.period*0.45;
cr.closed=closed;
if(closed&&pl.x+pl.w>cr.x&&pl.x<cr.x+cr.w&&pl.y+pl.h>cr.y-5&&pl.y+pl.h<cr.y+20&&pl.vy>=0){
pl.y=cr.y-pl.h;pl.vy=0;pl.gnd=true;onCroc=true;
}
}
}
if(s.crocWater){const cw=s.crocWater;
if(pl.x+pl.w>cw.x&&pl.x<cw.x+cw.w&&pl.y+pl.h>cw.y+10){
if(!onCroc)hurt();
}
}
if(s.water){
for(const w of s.water){
if(pl.x+pl.w>w.x&&pl.x<w.x+w.w&&pl.y+pl.h>w.y+10){hurt();break;}
}
}
for(let i=0;i<(s.c||[]).length;i++){
const c=s.c[i];
if(!c.f&&pl.x+pl.w>c.x-10&&pl.x<c.x+10&&pl.y+pl.h>c.y-10&&pl.y<c.y+10){c.f=1;score+=50;for(let j=0;j<8;j++)parts.push({x:c.x,y:c.y,vx:(rand()-0.5)*6,vy:(rand()-0.5)*6,life:30,col:'#FFD700'});}
}
if(s.win&&pl.x>360&&pl.x<440&&pl.y+pl.h>250){score+=500;gameState='VICTORY';}
for(let i=parts.length-1;i>=0;i--){const pt=parts[i];pt.x+=pt.vx;pt.y+=pt.vy;pt.life--;if(pt.life<=0)parts.splice(i,1);}
}

function draw(){
ctx.save();
if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
ctx.fillStyle='#0d1f0d';ctx.fillRect(0,0,W,H);
const s=SCRS[curScr];
const off=curScr*100;
for(let i=0;i<20;i++){
ctx.fillStyle='#1a3d1a';
ctx.beginPath();
ctx.moveTo(i*50-off%100,450);
ctx.lineTo(i*50+25-off%100,150+Math.sin(i)*50);
ctx.lineTo(i*50+50-off%100,450);
ctx.fill();
}
ctx.fillStyle='#2d4a3e';
for(let i=0;i<5;i++){
const rx=150+i*200-off*0.5%1000;
ctx.fillRect(rx,250,80,150);
ctx.beginPath();ctx.moveTo(rx,250);ctx.lineTo(rx+40,200);ctx.lineTo(rx+80,250);ctx.fill();
}
ctx.fillStyle='#5a5a5a';
for(const p of s.p){
ctx.fillRect(p.x,p.y,p.w,p.h);
ctx.fillStyle='#3d7a3d';ctx.fillRect(p.x,p.y,p.w,5);ctx.fillStyle='#5a5a5a';
ctx.strokeStyle='#3a3a3a';ctx.strokeRect(p.x,p.y,p.w,p.h);
}
// water
ctx.fillStyle='#1a4d6b';
if(s.water){
for(const w of s.water){ctx.fillRect(w.x,w.y,w.w,w.h);}
}
if(s.crocWater){const w=s.crocWater;ctx.fillRect(w.x,w.y,w.w,w.h);} if(s.crocs){
for(const cr of s.crocs){
ctx.fillStyle=cr.closed?'#3d7a3d':'#1e4f1e';
ctx.fillRect(cr.x,cr.y,cr.w,cr.h);
ctx.fillStyle=cr.closed?'#222':'#ff4444';
ctx.fillRect(cr.x+cr.w-12,cr.y+4,8,4);
ctx.fillStyle='#2b5d2b';
ctx.fillRect(cr.x,cr.y+cr.h-4,cr.w,4);
}
}
ctx.strokeStyle='#4a7c23';ctx.lineWidth=3;
for(const v of s.v||[]){
const vx=v.x+Math.sin(v.a)*v.l;
const vy=v.y+Math.cos(v.a)*v.l;
ctx.beginPath
();ctx.moveTo(v.x,v.y);ctx.lineTo(vx,vy);ctx.stroke();
ctx.fillStyle='#6b8e23';
ctx.beginPath();ctx.arc(vx,vy,8,0,Math.PI*2);ctx.fill();
}
for(const r of rollers){
ctx.fillStyle='#8b4513';
ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#5a2d0c';ctx.stroke();
}
for(const c of s.c||[]){
if(!c.f){
ctx.fillStyle='#FFD700';
ctx.beginPath();ctx.arc(c.x,c.y,6,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#FFA500';
ctx.beginPath();ctx.arc(c.x,c.y,4,0,Math.PI*2);ctx.fill();
}
}
if(s.cp){
ctx.fillStyle='#8B4513';
ctx.fillRect(s.cpx-15,G-80,30,80);
ctx.fillStyle='#D2691E';
ctx.fillRect(s.cpx-20,G-90,40,15);
ctx.fillStyle='#FFD700';
for(let i=0;i<3;i++){
ctx.beginPath();ctx.arc(s.cpx-10+i*10,G-75,4,0,Math.PI*2);ctx.fill();
}
}
if(s.win){
ctx.fillStyle='#4a4a4a';
ctx.fillRect(360,180,80,100);
ctx.fillStyle='#2a2a2a';
ctx.fillRect(370,190,60,5);
const glow=Math.sin(frame*0.1)*10+20;
ctx.shadowColor='#FFD700';ctx.shadowBlur=glow;
ctx.fillStyle='#FFD700';
ctx.beginPath();ctx.moveTo(400,210);ctx.lineTo(410,240);ctx.lineTo(390,240);ctx.fill();
ctx.beginPath();ctx.moveTo(400,240);ctx.lineTo(415,260);ctx.lineTo(385,260);ctx.fill();
ctx.shadowBlur=0;
}
for(const pt of parts){
ctx.globalAlpha=pt.life/30;
ctx.fillStyle=pt.col;
ctx.fillRect(pt.x-2,pt.y-2,4,4);
ctx.globalAlpha=1;
}
if(invuln>0&&Math.floor(frame/4)%2===0){
}else{
ctx.fillStyle='#F4C2A1';
ctx.fillRect(pl.x,pl.y,pl.w,pl.h);
ctx.fillStyle='#5C4033';
ctx.fillRect(pl.x,pl.y,pl.w,8);
ctx.fillStyle='#333';
ctx.fillRect(pl.x+(pl.face>0?14:4),pl.y+2,4,4);
ctx.fillStyle='#8B4513';
ctx.fillRect(pl.x,pl.y+12,pl.w,8);
ctx.fillStyle='#333';
ctx.fillRect(pl.x+4,pl.y+20,5,12);
ctx.fillRect(pl.x+11,pl.y+20,5,12);
ctx.fillStyle='#5C4033';
ctx.beginPath();ctx.arc(pl.x+pl.w/2,pl.y-8,12,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#3d3d3d';
ctx.fillRect(pl.x-2+(pl.face>0?18:0),pl.y-12,6,4);
}
ctx.fillStyle='#fff';
ctx.font='16px monospace';
ctx.fillText('LIVES:'+lives,10,20);
ctx.fillText('SCORE:'+score,100,20);
ctx.fillText('SCREEN:'+(curScr+1)+'/13',200,20);
if(debug){
ctx.fillStyle='#0f0';
ctx.fillText('FPS:'+Math.round(60),10,40);
ctx.fillText('POS:'+Math.round(pl.x)+','+Math.round(pl.y),10,60);
ctx.fillText('VINE:'+(pl.vine!==null?'YES':'NO'),10,80);
ctx.strokeStyle='#0f0';ctx.strokeRect(pl.x,pl.y,pl.w,pl.h);
}
if(gameState==='TITLE'){
ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#FFD700';ctx.font='bold 48px monospace';
ctx.fillText('QUEST FOR THE CLAW',140,150);
ctx.fillStyle='#fff';ctx.font='20px monospace';
ctx.fillText('Navigate the jungle ruins and collect',200,200);
ctx.fillText('the legendary golden claw!',250,230);
ctx.fillStyle='#0f0';ctx.font='24px monospace';
ctx.fillText('Press SPACE (or click) to Start',220,320);
}
if(gameState==='PAUSED'){
ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#FFD700';ctx.font='bold 48px monospace';
ctx.fillText('PAUSED',330,240);
}
if(gameState==='GAMEOVER'){
ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#f00';ctx.font='bold 48px monospace';
ctx.fillText('GAME OVER',280,200);
ctx.fillStyle='#fff';ctx.font='24px monospace';
ctx.fillText('Final Score: '+score,320,260);
ctx.fillText('Press SPACE to Retry',270,320);
}
if(gameState==='VICTORY'){
ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,W,H);
const glow=Math.sin(frame*0.1)*20+30;
ctx.shadowColor='#FFD700';ctx.shadowBlur=glow;
ctx.fillStyle='#FFD700';ctx.font='bold 48px monospace';
ctx.fillText('VICTORY!',300,180);
ctx.shadowBlur=0;
ctx.fillStyle='#fff';ctx.font='24px monospace';
ctx.fillText('You found the Golden Claw!',240,240);
ctx.fillText('Final Score: '+score,320,280);
ctx.fillText('Press SPACE to Return',260,340);
}
ctx.restore();
}

function loop(){
update();
draw();
requestAnimationFrame(loop);
}

window.__qftc={
getState:()=>({
score,lives,frame,gameState,
screenIndex:curScr,
victory:gameState==='VICTORY',
gameOver:gameState==='GAMEOVER',
player:{x:pl.x,y:pl.y,vx:pl.vx,vy:pl.vy,gnd:pl.gnd,vine:pl.vine}
}),
setInput:(state)=>{manualInput={...manualInput,...state};},
step:(dt=16.67)=>{
const steps=Math.max(1,Math.round(dt/16.67));
for(let i=0;i<steps;i++)update();
draw();
},
enableBot:(on=true)=>{botEnabled=on;if(on){gameState='PLAYING';reset();}},
setSeed:(seed)=>{rngSeed=seed>>>0;},
getScreenMeta:()=>SCRS.map(s=>s.meta)
};
window.__qftc.tick=window.__qftc.step;

reset();
loop();
</script>
</body>
</html>
